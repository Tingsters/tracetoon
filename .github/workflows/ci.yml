name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Bundle and run the end-to-end tests against it
        shell: bash
        run: |
          bun run bundle
          bun run build:check
          bun run test:bundled
      - name: Compile and rehearse publication against the executable
        shell: bash
        run: |
          bun run build
          bun run test:compiled
