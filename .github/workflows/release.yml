name: release

# Tags promote an evaluated artifact set; they never compile a replacement.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Read the reviewed promotion record
        id: promotion
        run: bun .github/scripts/release-assets.ts metadata release-promotion.json
      - name: Verify the artifact and successful originating CI run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.promotion.outputs.artifactId }}
          ARTIFACT_RUN: ${{ steps.promotion.outputs.runId }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN" --jq .conclusion)" = success
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact-metadata.json
          bun .github/scripts/release-assets.ts artifact artifact-metadata.json release-promotion.json
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ steps.promotion.outputs.artifactId }}
          run-id: ${{ steps.promotion.outputs.runId }}
          github-token: ${{ github.token }}
          path: release
          merge-multiple: true
      - name: Verify source identity, adoption evidence and exact evaluated bytes
        run: bun .github/scripts/release-assets.ts verify release release-promotion.json "$GITHUB_REF_NAME"
      - name: Publish the verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" release/* --title "Tracetoon $GITHUB_REF_NAME" --generate-notes $flags
