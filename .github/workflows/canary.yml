name: drift canary

# Agents change their log formats without notice. Once a week, run the real
# agents on a toy repo and check Tracetoon still recognizes every record type.
# Each agent runs only if its API key is configured as a repository secret.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out Showtail next to this repo
        run: git clone --depth 1 https://github.com/Tingsters/Showtail.git ../Showtail
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Toy repository
        run: |
          mkdir -p "$RUNNER_TEMP/toy" && cd "$RUNNER_TEMP/toy"
          git init -q -b main && git config user.email ci@example.com && git config user.name CI
          echo "# toy" > README.md && git add . && git commit -qm base && git checkout -qb feature
      - name: Claude Code session
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        working-directory: ${{ runner.temp }}/toy
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "Create hello.py that prints hello, then run it." --allowedTools "Write,Bash(python3 *)"
      - name: Codex session
        if: ${{ env.OPENAI_API_KEY != '' }}
        working-directory: ${{ runner.temp }}/toy
        run: |
          npm install -g @openai/codex
          codex exec --full-auto "Create goodbye.py that prints goodbye, then run it."
      - name: Probe log formats
        working-directory: ${{ runner.temp }}/toy
        run: bun "$GITHUB_WORKSPACE/src/cli.ts" doctor --probe --strict
