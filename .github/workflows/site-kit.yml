name: site-kit

# Builds the tracetoon.ai agent kit (scripts/site-kit.ts) for a published release and
# attaches it as tracetoon-site-kit.zip. It never changes the promoted assets: it only
# downloads tracetoon-skill.zip, checks it against the release's checksums.txt, and adds
# one more file. A separate workflow, because releases created with GITHUB_TOKEN don't
# fire `release: published`; workflow_run does fire after the release workflow.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the kit for (for example v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  site-kit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # For a tag push, the release run's head_branch is the tag.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Check the tag
        run: printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run dependencies:prepare
      - name: Download the released skill and check it against checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern tracetoon-skill.zip --pattern checksums.txt --dir release
          cd release && grep ' tracetoon-skill.zip$' checksums.txt | sha256sum -c -
      - name: Build the kit
        run: bun scripts/site-kit.ts --out site-kit --skill-zip release/tracetoon-skill.zip --zip tracetoon-site-kit.zip
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" tracetoon-site-kit.zip --clobber
